services:
  sql:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "mypass"
    expose:
      - "5432"
    volumes:
      - ./config/postgresql/init.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
      target: prod
#      target: prod-without-loki
    environment:
      DB_URL: "jdbc:postgresql://sql:5432/to_do"
      PG_USER: "user"
      PG_PASSWORD: "mypass"
      LOKI_URL: "http://loki:3100/loki/api/v1/push"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
#    ports:
#      - "8080:8080"
    expose:
      - "8080"
    restart: unless-stopped
    depends_on:
      - sql
    develop:
      watch:
        - action: rebuild
          path: ./src/main/java
        - action: rebuild
          path: ./src/main/resources
        - action: rebuild
          path: ./pom.xml

volumes:
  postgres_data: