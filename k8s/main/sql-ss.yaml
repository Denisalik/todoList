apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sql-ss
  namespace: main
  labels:
    app: sql
spec:
  serviceName: sql-service
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-status: "update"
        vault.hashicorp.com/agent-inject-secret-postgres.sh: "secret/data/postgres"
        vault.hashicorp.com/agent-inject-template-postgres.sh: |
          {{- with secret "secret/data/postgres" -}}
          export POSTGRES_PASSWORD={{ .Data.data.POSTGRES_PASSWORD }}
          export POSTGRES_USER={{ .Data.data.POSTGRES_USER }}
          {{- end }}
        vault.hashicorp.com/role: "main-role"
      labels:
        app: sql
    spec:
      serviceAccountName: main-service-account
      containers:
        - name: sql
          image: postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -a
              [ -f /vault/secrets/postgres.sh ] && . /vault/secrets/postgres.sh
              set +a
              exec docker-entrypoint.sh postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init.sh
              subPath: init.sh
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - '. /vault/secrets/postgres.sh; pg_isready -U "$POSTGRES_USER"'
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
                command:
                  - /bin/sh
                  - -c
                  - '. /vault/secrets/postgres.sh; pg_isready -U "$POSTGRES_USER"'
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: init
          configMap:
            name: sql-init-cm
            defaultMode: 0755
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard
