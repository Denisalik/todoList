apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cm
  namespace: obs
data:
  datasource.yaml: |
    apiVersion: 1
    
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-service:3100
        isDefault: false
        editable: true
    
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
